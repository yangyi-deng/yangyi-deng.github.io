# ---------------------------------------------------------------------------
# Site-wide settings. Edit these once and they propagate across every page.
# ---------------------------------------------------------------------------

title:       "Yangyi Deng"
description: "Personal website of Yangyi Deng, PhD Candidate in Business Economics."
url:         ""    # e.g. "https://yydeng.github.io" (optional, fine to leave blank)
baseurl:     ""    # leave "" if hosting at <username>.github.io

# Author profile — used in the page header and in the footer.
author:
  name:           "Yangyi Deng"
  name_zh:        "邓扬义"
  role:           "PhD Candidate in Business Economics"
  department:     "Department of Decisions, Operations and Technology"
  department_url: "https://www.bschool.cuhk.edu.hk/departments/decisions-operations-and-technology/"
  school:         "The Chinese University of Hong Kong (CUHK) Business School"
  school_url:     "https://www.bschool.cuhk.edu.hk/"
  institution:    "The Chinese University of Hong Kong"
  email:          "dengyangyi@link.cuhk.edu.hk"
  location:       "Shatin, N.T., Hong Kong"
  photo:          "/images/profile-web.jpg"
  cv: "https://www.dropbox.com/scl/fi/gzvd0t9235bb6c57jdxtg/CV-Yangyi-Deng.pdf?rlkey=1xowvlhpi93is8uun1mh2dg6u&st=a7waj4j4&dl=0"
  # Profile links — each one shows up as a button on the home page once filled in.
  googlescholar:  ""
  ssrn:           ""
  orcid:          ""
  linkedin:       ""
  github:         ""
 
# ---------------------------------------------------------------------------
# Collections — each markdown file in _publications/, _talks/, _teaching/
# becomes one entry on the corresponding page.
# ---------------------------------------------------------------------------
collections:
  publications:
    output: false
  talks:
    output: false
  teaching:
    output: false

defaults:
  - scope: { path: "" }
    values:
      layout: default

# ---------------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------------
markdown: kramdown
plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .bundle
  - "*.gem"
