<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{% if page.title and page.nav != 'about' %}{{ page.title }} — {% endif %}{{ site.author.name }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
</head>

<body>

  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-name">{{ site.author.name }}</span>
      </a>
      {% include nav.html %}
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
      <span>Last updated {{ site.time | date: "%B %Y" }}</span>
    </div>
  </footer>

</body>
</html>
